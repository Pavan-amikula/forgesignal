name: Quality and container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.lock.txt
      - run: python -m backend.ml
      - run: pytest -q --junitxml=artifacts/junit.xml
      - run: python -m scripts.evaluate_retrieval
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker build -t forgesignal:ci .
      - name: Start built container
        run: docker run --detach --name forge-smoke --publish 127.0.0.1:8000:8000 forgesignal:ci
      - name: Wait for container health
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2) as response:
                      assert response.status == 200
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit('Container did not become healthy')
          PY
      - name: Verify container SSE and MCP interoperability
        run: python -m scripts.verify_live
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-and-tests
          path: |
            artifacts/*report.json
            artifacts/*verification.json
            artifacts/junit.xml
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
